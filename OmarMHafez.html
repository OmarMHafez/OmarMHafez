<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OB & Gyn History Taking</title>
<style>
  :root{--primary:#243b53;--accent:#2f6f9f;--bg:#f4f7fa;--card:#fff;--border:#d9e2ec;--muted:#627d98;--danger:#b42318}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#172b4d}
  header{background:var(--primary);color:#fff;padding:18px 24px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0002}
  header h1{margin:0 0 5px;font-size:24px}
  header p{margin:0;color:#d9e2ec;font-size:13px}
  .app{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 80px)}
  aside{background:#fff;border-right:1px solid var(--border);padding:16px;position:sticky;top:80px;height:calc(100vh - 80px);overflow:auto}
  main{padding:22px;max-width:1200px;width:100%;margin:auto}
  button{border:0;border-radius:7px;padding:10px 14px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--accent);color:white}.btn-secondary{background:#e9eef3;color:#243b53}
  .btn-danger{background:#fee4e2;color:var(--danger)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .patient-list{display:flex;flex-direction:column;gap:7px;margin-top:14px}
  .patient-item-wrap{position:relative;display:flex;align-items:stretch;gap:5px}
  .patient-item{padding:11px 38px 11px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;text-align:left;flex:1;min-width:0}
  .patient-item.active{border-color:var(--accent);background:#edf6fb}
  .record-delete{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:27px;height:27px;padding:0;border-radius:50%;background:#fee4e2;color:var(--danger);font-size:19px;line-height:27px;z-index:2}
  .record-delete:hover{background:#fecdca}
  .patient-item small{display:block;color:var(--muted);margin-top:3px}
  .empty{color:var(--muted);font-size:13px;line-height:1.5;margin-top:15px}
  .sheet{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:18px}
  .sheet-title{font-size:25px;margin:0 0 5px;color:var(--primary)}
  .sheet-subtitle{color:var(--muted);margin:0 0 20px}
  .section{margin-top:22px;padding-top:18px;border-top:2px solid #edf2f7}
  .section h2{font-size:19px;margin:0 0 13px;color:var(--primary)}
  .section h2 span{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  label{font-size:12px;font-weight:700;color:#486581;display:block;margin-bottom:5px}
  input,textarea,select{width:100%;border:1px solid #bcccdc;border-radius:6px;padding:9px;background:#fff;color:#172b4d;font:inherit}
  textarea{min-height:90px;resize:vertical}
  .full{grid-column:1/-1}
  .checks{display:flex;flex-wrap:wrap;gap:10px 18px}
  .checks label{display:flex;align-items:center;gap:6px;font-weight:500;margin:0;color:#243b53}
  .checks input{width:auto}
  .hint{font-size:12px;color:var(--muted);margin:7px 0 12px}
  table{width:100%;border-collapse:collapse;margin-top:10px;min-width:1050px}
  .table-wrap{overflow:auto}
  th,td{border:1px solid var(--border);padding:7px;vertical-align:top}
  th{background:#f0f4f8;font-size:11px;color:#486581}
  td input{min-width:100px;border:0;padding:6px}
  .row-actions{white-space:nowrap;width:1%}
  .example{background:#f8fafc;border-left:4px solid #9fb3c8;padding:10px 12px;margin-top:12px;font-size:12px;line-height:1.5;color:#52606d}
  .diagnosis-box{background:#f0f7fb;border:1px solid #c6e0ee;border-radius:8px;padding:14px}
  .check-group{border:1px solid var(--border);border-radius:8px;padding:12px;margin:10px 0;background:#fbfdff}
  .check-group h3{font-size:14px;margin:0 0 8px;color:var(--primary)}
  .check-subgroup{margin:10px 0 5px;font-size:12px;font-weight:700;color:var(--accent)}
  .symptom-guide{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:6px;margin:8px 0 14px}
  .checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
  .checklist label{display:flex;align-items:flex-start;gap:7px;font-weight:500;color:#243b53;margin:0;line-height:1.35}
  .checklist input{width:auto;margin-top:2px;flex-shrink:0}
  @media(max-width:600px){.checklist{grid-template-columns:1fr}}
  .print-only{display:none}
  .floating{display:flex;justify-content:flex-end;gap:8px}
  .modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .modal-card{background:#fff;border-radius:14px;padding:28px;max-width:650px;width:100%;box-shadow:0 12px 40px #0004}
  .modal-card h2{margin:0 0 8px;color:var(--primary)}
  .type-buttons{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  .type-button{padding:28px 18px;border:2px solid var(--border);background:#fff;border-radius:12px;font-size:18px;color:var(--primary)}
  .type-button:hover,.type-button:focus-visible{border-color:var(--accent);background:#edf6fb;outline:3px solid #2f6f9f33;outline-offset:2px}
  .type-button .type-icon{display:block;font-size:34px;margin-bottom:10px}
  .type-button .type-name{display:block;font-size:18px;font-weight:700}
  .type-button small{line-height:1.45}
  .modal-hint{font-size:13px;color:var(--muted);margin:0}
  .type-button small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:7px}
  @media(max-width:600px){.type-buttons{grid-template-columns:1fr}}
  @media(max-width:850px){.app{grid-template-columns:1fr}aside{position:relative;top:0;height:auto;border-right:0;border-bottom:1px solid var(--border)}.grid,.grid-3{grid-template-columns:1fr}main{padding:12px}.sheet{padding:15px}}
  @media print{
    body{background:#fff}
    header,aside,.toolbar,.no-print{display:none!important}
    .app{display:block}
    main{padding:0;max-width:none}
    .sheet{border:0;padding:0;margin:0}
    .section{break-inside:avoid}
    input,textarea,select{border:0;padding:2px;background:transparent}
    textarea{min-height:45px}
    .symptom-guide{max-width:100%;max-height:260px;object-fit:contain}
    .check-group{break-inside:avoid}
    .checklist{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px}
    .table-wrap{overflow:visible}
    table{min-width:0;font-size:8px}
    th,td{padding:4px}
    .print-only{display:block}
    .page-break{break-before:page}
  }
</style>
</head>
<body>
<header>
  <h1>OB & Gyn History Taking</h1>
  <p>Multi-patient HTML history sheet • Obstetrics and Gynaecology • print-friendly</p>
</header>

<div id="typeModal" class="modal">
  <div class="modal-card">
    <h2>Choose History Type</h2>
    <p class="modal-hint">Choose the type of history you want to record.</p>
    <div class="type-buttons">
      <button class="type-button" onclick="createPatient('Obstetrics')" aria-label="Create an obstetrics history">
        <span class="type-icon" aria-hidden="true">🤰</span><span class="type-name">Obstetrics</span>
        <small>Pregnancy, antenatal history, and previous pregnancies</small>
      </button>
      <button class="type-button" onclick="createPatient('Gynaecology')" aria-label="Create a gynaecology history">
        <span class="type-icon" aria-hidden="true">🩺</span><span class="type-name">Gynaecology</span>
        <small>Menstrual, reproductive, and gynaecological concerns</small>
      </button>
    </div>
    <div style="text-align:right;margin-top:18px"><button class="btn-secondary" onclick="closeTypeModal()">Cancel</button></div>
  </div>
</div>

<div class="app">
  <aside class="no-print">
    <button class="btn-primary" style="width:100%" onclick="addPatient()">＋ Add Patient</button>
    <div class="toolbar" style="margin-top:10px">
      <button class="btn-secondary" onclick="printCurrent()">Print Current</button>
      <button class="btn-secondary" onclick="printAll()">Print All</button>
      <button class="btn-secondary" onclick="exportData()">Export</button>
      <button class="btn-secondary" onclick="importData()">Import</button>
    </div>
    <div id="patientList" class="patient-list"></div>
    <div class="empty">Patients are saved automatically in this browser. Use Export to keep a backup or move the records to another browser/device.</div>
  </aside>

  <main>
    <div id="workspace"></div>
  </main>
</div>

<script>
const STORAGE_KEY = 'obgyn_history_patients_v1';
let patients = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentId = patients[0]?.id || null;

function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(patients))}
function patient(){return patients.find(p=>p.id===currentId)}
function val(key){return esc(patient()?.data?.[key]||'')}
function setVal(key,value){let p=patient(); if(!p)return; p.data[key]=value; save(); updatePatientLabel()}
function updatePatientLabel(){
  const p=patient(); if(!p)return;
  const name=p.data.name||'Unnamed patient';
  p.label=name;
  const el=document.querySelector(`.patient-item[data-id="${p.id}"]`);
  if(el) el.innerHTML=`<strong>${esc(name)}</strong><small>${p.type} • ${esc(p.data.age||'Age not entered')}</small>`;
}
function field(key,label,type='text',cls=''){
  return `<div class="${cls}"><label>${label}</label><input type="${type}" data-key="${key}" value="${val(key)}"></div>`
}
function area(key,label,cls='full'){
  return `<div class="${cls}"><label>${label}</label><textarea data-key="${key}">${val(key)}</textarea></div>`
}
function selectField(key,label,options,cls=''){
  return `<div class="${cls}"><label>${label}</label><select data-key="${key}"><option value=""></option>${options.map(o=>`<option ${patient()?.data?.[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`
}
function checks(prefix,items){
  return `<div class="checks">${items.map((x,i)=>`<label><input type="checkbox" data-check="${prefix}_${i}" ${patient()?.data?.checks?.[prefix+'_'+i]?'checked':''}>${esc(x)}</label>`).join('')}</div>`
}
function checklistGroup(prefix, groups){
  let n=0;
  return `<div>${groups.map(g=>`<div class="check-group"><h3>${esc(g.heading)}</h3>${(g.subgroups||[{heading:'',items:g.items||[]}]).map(s=>`${s.heading?`<div class="check-subgroup">${esc(s.heading)}</div>`:''}<div class="checklist">${s.items.map(item=>{const key=prefix+'_'+(n++);return `<label><input type="checkbox" data-check="${key}" ${patient()?.data?.checks?.[key]?'checked':''}>${esc(item)}</label>`}).join('')}</div>`).join('')}</div>`).join('')}</div>`
}
function otherSystemReview(prefix){
 return `${checklistGroup(prefix,[
  {heading:'General / Constitutional',items:['Fever or chills','Loss of appetite','Unintentional weight loss or gain','Fatigue / weakness']},
  {heading:'Cardiovascular',items:['Chest pain','Palpitations','Shortness of breath on exertion','Orthopnea / PND','Leg swelling']},
  {heading:'Respiratory',items:['Cough','Sputum / expectoration','Hemoptysis','Wheezing / breathlessness']},
  {heading:'Gastrointestinal',items:['Nausea / vomiting','Abdominal pain','Constipation','Diarrhea','Blood in stool']},
  {heading:'Urinary',items:['Dysuria','Frequency / urgency','Hematuria','Loin pain']},
  {heading:'Neurological',items:['Headache','Dizziness / fainting','Visual disturbance','Weakness / numbness']},
  {heading:'Endocrine / Metabolic',items:['Polyuria','Polydipsia','Polyphagia','Heat / cold intolerance']}
 ])}`
}
function diagnosisObs(){
  return `<div class="diagnosis-box">
    <div class="grid">
      ${field('dx_name_age_parity','Name, age, parity')}
      ${field('dx_ga','Gestational age in weeks')}
      ${selectField('dx_presentation','Presentation',['Cephalic','Breech','Transverse','Other'])}
      ${selectField('dx_labor','In labor or not',['In labor','Not in labor'])}
      ${area('dx_association','Association / complications (Obstetric, Medical, Fetal)')}
    </div>
  </div>
  <div class="example"><strong>Source example:</strong> Mrs. Smith, 32 years old, G2P1, 36 weeks, cephalic/left occiput transverse, not in labor, with well-controlled gestational diabetes; growth ultrasound and NST planned.</div>`
}
function personalObs(){
 return `<div class="grid">
   ${field('name','Name')}${field('age','Age','number')}${field('occupation','Occupation')}${field('marital_status','Marital status')}
   ${field('married_since','Married since / married for')}
   ${field('parity','Parity')}
   ${field('residence','Residence')}
   ${area('special_habits','Special habits of medical importance')}
 </div>
 <div class="hint">Notes from the sheet: smoking, alcohol, drug addiction, pets; other examples include high vaginal douching, tooth washing, excessive tea/coffee.</div>
 <h3>Husband History</h3>
 <div class="grid">
   ${field('husband_name','Name')}${field('husband_age','Age','number')}${field('husband_occupation','Occupation')}${field('husband_habits','Special habits')}
   ${field('husband_marital_status','Marital status')}${field('domestic_abuse','Domestic abuse')}
 </div>`
}
function personalGyn(){
 return `<div class="grid">
   ${field('name','Name')}${field('age','Age','number')}${field('occupation','Occupation')}${field('marital_status','Marital status')}
   ${field('married_since','Married since / married for')}
   ${field('parity','Parity')}${field('residence','Residence')}
   ${area('special_habits','Special habits of medical importance')}
 </div>
 <div class="hint">The sheet also prompts about first/second marriage, smoking/alcohol/drugs, pets and other habits.</div>
 <h3>Husband History</h3>
 <div class="grid">
   ${field('husband_name','Name')}${field('husband_age','Age','number')}${field('husband_occupation','Occupation')}${field('husband_habits','Special habits')}
   ${field('husband_marital_status','Marital status')}
 </div>`
}
const obstetricCols=['No','DOB','POB','Sex','Weight at Birth','Time / Maturity in weeks','Antenatal period','Method of delivery (spontaneous / induced; labor details)','Puerperium','Alive / SB / Died later','Infant feeding','Death cause'];
const gynObsCols=obstetricCols;
function pregnancyTable(){
 const rows=patient()?.data?.pregnancies||[{}];
 return `<div class="table-wrap"><table><thead><tr>${obstetricCols.map(c=>`<th>${c}</th>`).join('')}<th class="no-print">Action</th></tr></thead>
 <tbody>${rows.map((r,i)=>`<tr>${obstetricCols.map((c,j)=>`<td><input data-preg="${i}" data-col="${j}" value="${esc(r[j]||'')}"></td>`).join('')}<td class="row-actions no-print"><button class="btn-danger" onclick="removePreg(${i})">Remove</button></td></tr>`).join('')}</tbody></table></div>
 <button class="btn-secondary no-print" onclick="addPreg()">＋ Add pregnancy</button>`
}
function menstrualObs(){
 return `<div class="grid">
 ${field('menarche','Menarche')}${field('menstrual_regularity','Regularity')}${field('cycle','Cycle')}${field('duration','Duration')}
 ${field('amount','Amount')}${field('lmp','LMP')}${field('edd','EDD')}${field('ega','EGA')}
 ${area('associated_symptoms','Associated symptoms [Pain, Bleeding, Discharge]')}
 </div>
 <div class="hint">The sheet notes that for pregnancy dating the patient should be sure of her dates, have at least 3 regular cycles before pregnancy, and have had no hormonal contraception in the previous 3 months.</div>`
}
function menstrualGyn(){
 return `<div class="grid">
 ${field('menarche','Menarche')}${field('menstrual_regularity','Regularity')}${field('cycle','Cycle')}${field('duration','Duration')}
 ${field('amount','Amount')}${field('lmp','LMP')}${area('associated_symptoms','Associated symptoms [Pain, Bleeding, Discharge]')}
 </div>`
}
function contraception(){
 return `<div class="table-wrap"><table><thead><tr><th>Method</th><th>Duration</th><th class="no-print">Action</th></tr></thead>
 <tbody>${(patient()?.data?.contraceptives||[{}]).map((r,i)=>`<tr><td><input data-contr="${i}" data-col="0" value="${esc(r[0]||'')}"></td><td><input data-contr="${i}" data-col="1" value="${esc(r[1]||'')}"></td><td class="row-actions no-print"><button class="btn-danger" onclick="removeContr(${i})">Remove</button></td></tr>`).join('')}</tbody></table></div>
 <button class="btn-secondary no-print" onclick="addContr()">＋ Add method</button>
 <div class="grid" style="margin-top:12px">
 ${area('contr_last_why','Last method — why stopped (due to complications or to get pregnant)?')}
 ${field('contr_last_removed','Last method — when removed (before this pregnancy)?')}
 ${field('contr_cycles','Were cycles regular at that period or not?')}
 </div>`
}
function pastHistory(){
 return `<div class="grid">
 ${area('medical_history','Medical history')}
 ${area('surgical_history','Surgical history')}
 ${area('hospital_admission','Hospital admission')}
 ${area('blood_transfusion','Blood transfusion')}
 </div>`
}
function familyHistory(){
 return `${checks('family',['Consanguinity','Similar condition','Diseases running in family & medical disorders','Twins'])}
 <div class="hint">The source sheet specifically lists family medical disorders such as diabetes, hypertension, tumors and congenital abnormalities, plus twins and a similar condition in relatives.</div>`
}
function hpiObs(){
  return `<div class="grid">
    ${area('hpi_current_complaint','History of Present Pregnancy — chronological HPI')}
  </div>`
}
function renderObs(){
 return `<div class="sheet">
   <h1 class="sheet-title">Obstetric History Taking Sheet</h1><p class="sheet-subtitle">Patient: ${esc(patient()?.data?.name||'Unnamed patient')}</p>
   <div class="section"><h2><span>Diagnosis</span></h2>${diagnosisObs()}</div>
   <div class="section"><h2>❶ Personal History <span>[+/- Husband History]</span></h2>${personalObs()}</div>
   <div class="section"><h2>❷ Complaint</h2>${area('complaint','Complaint (patient’s own words)')}</div>
   <div class="section"><h2>❸ Obstetric History</h2><div class="grid">${field('gravidity','Gravidity')}${field('obst_parity','Parity')}</div><div class="hint">For each pregnancy:</div>${pregnancyTable()}</div>
   <div class="section"><h2>❹ Menstrual History</h2>${menstrualObs()}</div>
   <div class="section"><h2>❺ Contraceptive History</h2>${contraception()}</div>
   <div class="section"><h2>❻ History of Present Pregnancy</h2>${hpiObs()}</div>
    <div class="section"><h2>Other System Review</h2>${otherSystemReview('ob_ros')}</div>
   <div class="section"><h2>❼ Past History</h2>${pastHistory()}</div>
   <div class="section"><h2>❽ Drug History and Allergy</h2>${area('drug_history','Drug history')}${area('allergy','Allergy')}</div>
   <div class="section"><h2>❾ Family History</h2>${familyHistory()}</div>
   <div class="floating no-print"><button class="btn-primary" onclick="printCurrent()">Print this history</button></div>
 </div>`
}
function hpiGyn(){
  return `<div class="grid">
    ${area('hpi_summary','History of Present Illness — chronological narrative')}

  </div>`
}
function renderGyn(){
 return `<div class="sheet">
   <h1 class="sheet-title">Gynaecology History Taking Sheet</h1><p class="sheet-subtitle">Patient: ${esc(patient()?.data?.name||'Unnamed patient')}</p>
   <div class="section"><h2><span>Diagnosis</span></h2>
     <div class="diagnosis-box"><div class="grid">
       ${field('dx_name_age_parity','Name, age, parity')}
       ${area('dx_presenting_complaint','Presenting complaint')}
       ${area('dx_apparent_cause','Apparent cause')}
       ${area('dx_associated_disorders','Associated disorders')}
     </div></div>
   </div>
   <div class="section"><h2>❶ Personal History <span>[+/- Husband History]</span></h2>${personalGyn()}</div>
   <div class="section"><h2>❷ Complaint</h2>${area('complaint','Complaint — patient’s own words, no medical diagnosis')}</div>
   <div class="section"><h2>❸ History of Present Illness</h2>${hpiGyn()}</div>
    <div class="section"><h2>Other System Review</h2>${otherSystemReview('gyn_ros')}</div>
   <div class="section"><h2>❹ Menstrual History</h2>${menstrualGyn()}</div>
   <div class="section"><h2>❺ Obstetric History</h2><div class="grid">${field('gravidity','Gravidity')}${field('obst_parity','Parity')}</div><div class="hint">For each pregnancy:</div>${pregnancyTable()}</div>
   <div class="section"><h2>❻ Contraceptive History</h2>${contraception()}</div>
   <div class="section"><h2>❼ Past History</h2>${pastHistory()}</div>
   <div class="section"><h2>❽ Drug History and Allergy</h2>${area('drug_history','Drug history')}${area('allergy','Allergy')}</div>
   <div class="section"><h2>❾ Family History</h2>${familyHistory()}</div>
   <div class="floating no-print"><button class="btn-primary" onclick="printCurrent()">Print this history</button></div>
 </div>`
}
function render(){
 renderList();
 const w=document.getElementById('workspace');
 if(!patient()){
   w.innerHTML=`<div class="sheet"><h2>Start a history</h2><p>Select Obstetrics or Gynaecology when adding the first patient.</p><button class="btn-primary" onclick="addPatient()">＋ Add Patient</button></div>`;
   return;
 }
 w.innerHTML=patient().type==='Obstetrics'?renderObs():renderGyn();
 bindFields();
}
function renderList(){
 const list=document.getElementById('patientList');
 list.innerHTML=patients.map(p=>`<div class="patient-item-wrap">
   <button class="patient-item ${p.id===currentId?'active':''}" data-id="${p.id}" onclick="selectPatient('${p.id}')">
     <strong>${esc(p.label||p.data.name||'Unnamed patient')}</strong>
     <small>${p.type} • ${esc(p.data.age||'Age not entered')}</small>
   </button>
   <button class="record-delete no-print" title="Remove this patient record" onclick="event.stopPropagation(); removePatient('${p.id}')">×</button>
 </div>`).join('');
}
function removePatient(id){
 const p=patients.find(x=>x.id===id);
 if(!p)return;
 const name=p.data?.name || 'Unnamed patient';
 if(!confirm(`Remove the record for "${name}"?\n\nThis cannot be undone unless you have exported a backup.`)) return;
 const index=patients.findIndex(x=>x.id===id);
 patients.splice(index,1);
 if(currentId===id){
   currentId=patients[Math.max(0,index-1)]?.id || patients[0]?.id || null;
 }
 save();
 render();
}
function selectPatient(id){currentId=id;render()}
function addPatient(){
 const modal=document.getElementById('typeModal');
 modal.classList.add('show');
 modal.querySelector('.type-button')?.focus();
}
function closeTypeModal(){
 document.getElementById('typeModal').classList.remove('show');
}
function createPatient(type){
 if(type!=='Obstetrics'&&type!=='Gynaecology')return;
 const p={id:Date.now().toString(),type,label:'Unnamed patient',data:{name:'',pregnancies:[{}],contraceptives:[{}],checks:{}}};
 patients.push(p);currentId=p.id;save();closeTypeModal();render();
 setTimeout(()=>document.querySelector('[data-key="name"]')?.focus(),50);
}
function bindFields(){
 document.querySelectorAll('[data-key]').forEach(el=>{
   el.addEventListener('input',e=>{setVal(e.target.dataset.key,e.target.value);});
   el.addEventListener('change',e=>{setVal(e.target.dataset.key,e.target.value);});
 });
 document.querySelectorAll('[data-check]').forEach(el=>{
   el.addEventListener('change',e=>{
     let p=patient();p.data.checks=p.data.checks||{};p.data.checks[e.target.dataset.check]=e.target.checked;save();
   });
 });
 document.querySelectorAll('[data-preg]').forEach(el=>{
   el.addEventListener('input',e=>{
     let p=patient(),i=+e.target.dataset.preg,j=+e.target.dataset.col;
     p.data.pregnancies[i]=p.data.pregnancies[i]||{};p.data.pregnancies[i][j]=e.target.value;save();
   });
 });
 document.querySelectorAll('[data-contr]').forEach(el=>{
   el.addEventListener('input',e=>{
     let p=patient(),i=+e.target.dataset.contr,j=+e.target.dataset.col;
     p.data.contraceptives[i]=p.data.contraceptives[i]||{};p.data.contraceptives[i][j]=e.target.value;save();
   });
 });
}
function addPreg(){patient().data.pregnancies.push({});save();render()}
function removePreg(i){patient().data.pregnancies.splice(i,1);if(!patient().data.pregnancies.length)patient().data.pregnancies=[{}];save();render()}
function addContr(){patient().data.contraceptives.push({});save();render()}
function removeContr(i){patient().data.contraceptives.splice(i,1);if(!patient().data.contraceptives.length)patient().data.contraceptives=[{}];save();render()}
function printCurrent(){window.print()}
function printAll(){
 if(!patients.length){alert('No patients to print.');return}
 const old=currentId;
 currentId=patients[0].id;
 let html='';
 patients.forEach((p,i)=>{
   currentId=p.id;
   html+=`<div class="${i?'page-break':''}">${p.type==='Obstetrics'?renderObs():renderGyn()}</div>`;
 });
 currentId=old;
 const w=document.getElementById('workspace');
 const oldHTML=w.innerHTML;
 w.innerHTML=html;
 setTimeout(()=>{window.print();setTimeout(()=>{w.innerHTML=oldHTML;render();},300)},100);
}
function exportData(){
 const blob=new Blob([JSON.stringify(patients,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='obgyn-history-backup.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(){
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=e=>{
   const file=e.target.files[0];if(!file)return;
   const r=new FileReader();r.onload=()=>{
     try{
       const imported=JSON.parse(r.result);
       if(!Array.isArray(imported))throw new Error();
       patients=imported;currentId=patients[0]?.id||null;save();render();
     }catch(err){alert('Invalid history backup file.')}
   };r.readAsText(file);
 };input.click();
}
render();
</script>
</body>
</html>
